<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lifts</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }
    aside {
      border-right: 1px solid rgba(128, 128, 128, 0.3);
      padding: 1.5rem 1rem;
    }
    aside h1 { font-size: 1.25rem; margin: 0 0 1rem; }
    .home { color: inherit; text-decoration: none; cursor: pointer; }
    .home:hover { text-decoration: underline; }
    nav ul { list-style: none; margin: 0; padding: 0; }
    nav li { margin: 0.25rem 0; }
    nav a {
      display: block;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      color: inherit;
      text-decoration: none;
    }
    nav a:hover { background: rgba(128, 128, 128, 0.15); }
    nav a.active { background: rgba(128, 128, 128, 0.25); font-weight: 600; }

    main { padding: 2rem 2.5rem; max-width: 720px; }
    main h2 { font-size: 1.4rem; margin: 0 0 1rem; }
    main h3 { font-size: 1.05rem; margin: 0; }
    .empty { opacity: 0.7; }
    .muted { opacity: 0.7; font-size: 0.85rem; }

    /* Shared control styling, kept deliberately plain to match the rest. */
    button, .btn {
      display: inline-block;
      padding: 0.4rem 0.75rem;
      border: 1px solid rgba(128, 128, 128, 0.4);
      border-radius: 6px;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 0.9rem;
      text-decoration: none;
      cursor: pointer;
    }
    button:hover, .btn:hover { background: rgba(128, 128, 128, 0.15); }
    button.primary { font-weight: 600; border-color: rgba(128, 128, 128, 0.7); }
    button.small { padding: 0.2rem 0.5rem; font-size: 0.8rem; }
    button.danger:hover { background: rgba(220, 80, 80, 0.2); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    input, select, textarea {
      padding: 0.4rem 0.5rem;
      border: 1px solid rgba(128, 128, 128, 0.4);
      border-radius: 6px;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 0.9rem;
      max-width: 100%;
      box-sizing: border-box;
    }
    textarea { width: 100%; min-height: 8rem; line-height: 1.5; }
    label { display: block; margin: 0 0 1rem; }
    label span { display: block; font-size: 0.85rem; opacity: 0.7; margin-bottom: 0.25rem; }

    .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }

    /* Banner used for the read-only notice and for save results. */
    .banner {
      padding: 0.6rem 0.75rem;
      border: 1px solid rgba(128, 128, 128, 0.4);
      border-radius: 6px;
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
    }
    .banner.error { border-color: rgba(220, 80, 80, 0.6); }
    .banner a { color: inherit; }

    .card {
      border: 1px solid rgba(128, 128, 128, 0.3);
      border-radius: 6px;
      padding: 0.9rem 1rem;
      margin-bottom: 0.75rem;
    }
    .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }

    table.sets { width: auto; border-collapse: collapse; margin: 0.5rem 0; font-size: 0.9rem; }
    table.sets th { text-align: left; font-weight: 400; opacity: 0.7; font-size: 0.8rem; padding: 0 0.4rem 0.25rem 0; }
    table.sets td { padding: 0.15rem 0.4rem 0.15rem 0; }
    table.sets input { width: 5.5rem; }
    table.sets td.n { width: 2rem; opacity: 0.7; }

    #status { font-size: 0.85rem; opacity: 0.8; margin-top: 1rem; min-height: 1.2em; }

    @media (max-width: 640px) {
      body { grid-template-columns: 1fr; }
      aside { border-right: none; border-bottom: 1px solid rgba(128, 128, 128, 0.3); }
      main { padding: 1.5rem 1rem; }
      table.sets { width: 100%; }
      table.sets input { width: 100%; }
    }
  </style>
</head>
<body>
  <aside>
    <h1><a href="#log" class="home">Lifts</a></h1>
    <nav>
      <ul id="nav">
        <li><a href="#log" data-view="log">Log a session</a></li>
        <li><a href="#history" data-view="history">History</a></li>
        <li><a href="#routines" data-view="routines">Routines</a></li>
        <li><a href="#settings" data-view="settings">Settings</a></li>
      </ul>
    </nav>
    <p id="status"></p>
  </aside>
  <main id="content">
    <p class="empty">Loading…</p>
  </main>

  <script>
  (function () {
    "use strict";

    // The repository the data files live in. Change these if the app is forked.
    const REPO = { owner: "ddjnkm", name: "lifts", branch: "main" };
    const PATHS = { routines: "data/routines.json", sessions: "data/sessions.json" };
    const TOKEN_KEY = "lifts.token";
    const DRAFT_KEY = "lifts.draft";
    const UNIT = "lbs";

    const content = document.getElementById("content");
    const statusEl = document.getElementById("status");

    const state = {
      routines: [],
      sessions: [],
      sha: { routines: null, sessions: null },
      loaded: false,
      loadError: "",
      draft: null,
      busy: false,
    };

    // ---------------------------------------------------------------- helpers

    const token = () => localStorage.getItem(TOKEN_KEY) || "";
    const esc = (s) => String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
    const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const today = () => {
      // Local date, not UTC, so a late-evening session is not filed as tomorrow.
      const d = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    };
    const prettyDate = (iso) => {
      const [y, m, d] = String(iso).split("-").map(Number);
      if (!y || !m || !d) return iso;
      return new Date(y, m - 1, d).toLocaleDateString(undefined,
        { weekday: "short", year: "numeric", month: "short", day: "numeric" });
    };
    const setStatus = (msg) => { statusEl.textContent = msg || ""; };

    function summariseSets(sets) {
      return (sets || [])
        .filter((s) => s.reps)
        .map((s) => (s.weight ? s.weight + "×" + s.reps : "BW×" + s.reps))
        .join(", ");
    }

    // The most recent recorded sets for an exercise, used to prefill the form
    // and to show what there is to beat.
    function lastSetsFor(name) {
      const key = String(name).trim().toLowerCase();
      const sorted = state.sessions.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
      for (const session of sorted) {
        for (const ex of session.exercises || []) {
          if (String(ex.name).trim().toLowerCase() === key && (ex.sets || []).length) {
            return { date: session.date, sets: ex.sets };
          }
        }
      }
      return null;
    }

    // ------------------------------------------------------------ GitHub I/O

    function b64encode(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = "";
      for (const byte of bytes) bin += String.fromCharCode(byte);
      return btoa(bin);
    }

    function b64decode(b64) {
      const bin = atob(String(b64).replace(/\s/g, ""));
      const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function apiHeaders() {
      const headers = { Accept: "application/vnd.github+json" };
      if (token()) headers.Authorization = "Bearer " + token();
      return headers;
    }

    // Reads a data file. With a token we go through the API so we also get the
    // blob sha needed to write it back; without one we fall back to the copy
    // served alongside this page, which makes the site readable when signed out.
    async function loadFile(key) {
      const path = PATHS[key];
      if (token()) {
        const url = "https://api.github.com/repos/" + REPO.owner + "/" + REPO.name +
          "/contents/" + path + "?ref=" + encodeURIComponent(REPO.branch) +
          "&t=" + Date.now();
        const res = await fetch(url, { headers: apiHeaders(), cache: "no-store" });
        if (res.status === 404) return { data: [], sha: null };
        if (!res.ok) throw new Error("GitHub API " + res.status + " reading " + path);
        const json = await res.json();
        const parsed = JSON.parse(b64decode(json.content) || "[]");
        return { data: Array.isArray(parsed) ? parsed : [], sha: json.sha };
      }
      const res = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("Could not read " + path);
      const parsed = await res.json();
      return { data: Array.isArray(parsed) ? parsed : [], sha: null };
    }

    async function saveFile(key, data, message) {
      if (!token()) throw new Error("No GitHub token set. Add one in Settings to save.");
      const path = PATHS[key];
      const body = {
        message: message,
        content: b64encode(JSON.stringify(data, null, 2) + "\n"),
        branch: REPO.branch,
      };
      if (state.sha[key]) body.sha = state.sha[key];
      const res = await fetch(
        "https://api.github.com/repos/" + REPO.owner + "/" + REPO.name + "/contents/" + path,
        { method: "PUT", headers: apiHeaders(), body: JSON.stringify(body) });
      if (!res.ok) {
        let detail = "";
        try { detail = (await res.json()).message || ""; } catch (e) { /* ignore */ }
        if (res.status === 409 || res.status === 422) {
          throw new Error("The file changed on GitHub since this page loaded. " +
            "Reload the page and try again. (" + res.status + " " + detail + ")");
        }
        if (res.status === 401 || res.status === 403) {
          throw new Error("GitHub rejected the token (" + res.status + "). Check it in Settings. " + detail);
        }
        throw new Error("GitHub API " + res.status + ". " + detail);
      }
      const json = await res.json();
      state.sha[key] = json.content.sha;
    }

    async function loadAll() {
      state.loaded = false;
      state.loadError = "";
      setStatus("Loading…");
      try {
        const [routines, sessions] = await Promise.all([loadFile("routines"), loadFile("sessions")]);
        state.routines = routines.data;
        state.sessions = sessions.data;
        state.sha.routines = routines.sha;
        state.sha.sessions = sessions.sha;
        state.loaded = true;
        setStatus(token() ? "Signed in to GitHub." : "Read-only.");
      } catch (err) {
        state.loadError = err.message;
        setStatus("Load failed.");
      }
    }

    // ---------------------------------------------------------------- drafts

    function saveDraft() {
      try {
        if (state.draft) localStorage.setItem(DRAFT_KEY, JSON.stringify(state.draft));
        else localStorage.removeItem(DRAFT_KEY);
      } catch (e) { /* storage may be unavailable; the draft is a convenience */ }
    }

    function loadDraft() {
      try {
        const raw = localStorage.getItem(DRAFT_KEY);
        if (raw) state.draft = JSON.parse(raw);
      } catch (e) { state.draft = null; }
    }

    function newDraft(routineId) {
      const routine = state.routines.find((r) => r.id === routineId);
      const draft = {
        date: today(),
        routineId: routine ? routine.id : "",
        routineName: routine ? routine.name : "",
        exercises: [],
      };
      if (routine) {
        for (const name of routine.exercises) {
          const last = lastSetsFor(name);
          // Prefill with last time's weights so a repeat session is a few taps.
          const sets = last
            ? last.sets.map((s) => ({ weight: s.weight, reps: s.reps }))
            : [{ weight: "", reps: "" }];
          draft.exercises.push({ name: name, sets: sets });
        }
      }
      return draft;
    }

    // ------------------------------------------------------------- rendering

    function banner() {
      if (state.loadError) {
        return '<p class="banner error">Could not load your data: ' + esc(state.loadError) + "</p>";
      }
      if (!token()) {
        return '<p class="banner">Read-only. Add a GitHub token in ' +
          '<a href="#settings">Settings</a> to save routines and sessions.</p>';
      }
      return "";
    }

    function renderLog() {
      if (!state.draft) state.draft = newDraft(state.routines.length ? state.routines[0].id : "");
      const draft = state.draft;

      const options = ['<option value="">No routine (free session)</option>']
        .concat(state.routines.map((r) =>
          '<option value="' + esc(r.id) + '"' + (r.id === draft.routineId ? " selected" : "") +
          ">" + esc(r.name) + "</option>"));

      const exercises = draft.exercises.map((ex, i) => {
        const last = lastSetsFor(ex.name);
        const lastLine = last
          ? '<p class="muted">Last (' + esc(prettyDate(last.date)) + "): " + esc(summariseSets(last.sets)) + "</p>"
          : '<p class="muted">No previous entry.</p>';
        const rows = ex.sets.map((s, j) =>
          '<tr>' +
            '<td class="n">' + (j + 1) + "</td>" +
            '<td><input type="number" step="0.5" min="0" inputmode="decimal" ' +
              'data-ex="' + i + '" data-set="' + j + '" data-field="weight" ' +
              'value="' + esc(s.weight) + '" placeholder="0"></td>' +
            '<td><input type="number" step="1" min="0" inputmode="numeric" ' +
              'data-ex="' + i + '" data-set="' + j + '" data-field="reps" ' +
              'value="' + esc(s.reps) + '" placeholder="0"></td>' +
            '<td><button class="small danger" data-action="remove-set" ' +
              'data-ex="' + i + '" data-set="' + j + '" title="Remove set">×</button></td>' +
          "</tr>").join("");

        return '<div class="card">' +
          '<div class="card-head"><h3>' + esc(ex.name) + "</h3>" +
            '<button class="small danger" data-action="remove-exercise" data-ex="' + i + '">Remove</button></div>' +
          lastLine +
          '<table class="sets"><thead><tr><th></th><th>Weight (' + UNIT + ")</th><th>Reps</th><th></th></tr></thead>" +
            "<tbody>" + rows + "</tbody></table>" +
          '<button class="small" data-action="add-set" data-ex="' + i + '">+ Add set</button>' +
        "</div>";
      }).join("");

      content.innerHTML = banner() +
        "<h2>Log a session</h2>" +
        '<div class="row">' +
          '<label style="margin:0"><span>Date</span>' +
            '<input type="date" id="date" value="' + esc(draft.date) + '"></label>' +
          '<label style="margin:0"><span>Routine</span>' +
            '<select id="routine">' + options.join("") + "</select></label>" +
        "</div>" +
        (exercises || '<p class="empty">No exercises yet. Pick a routine, or add one below.</p>') +
        '<div class="row" style="margin-top:1rem">' +
          '<input id="new-exercise" placeholder="Add an exercise…">' +
          '<button data-action="add-exercise">Add</button>' +
        "</div>" +
        '<div class="row">' +
          '<button class="primary" data-action="save-session"' + (token() ? "" : " disabled") + ">Save session</button>" +
          '<button data-action="clear-draft">Clear</button>' +
        "</div>";
    }

    function renderHistory() {
      const sessions = state.sessions.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
      const cards = sessions.map((s) => {
        const lines = (s.exercises || []).map((ex) =>
          "<li><strong>" + esc(ex.name) + "</strong> — " + esc(summariseSets(ex.sets) || "no sets") + "</li>").join("");
        return '<div class="card">' +
          '<div class="card-head"><h3>' + esc(prettyDate(s.date)) + "</h3>" +
            '<button class="small danger" data-action="delete-session" data-id="' + esc(s.id) + '"' +
              (token() ? "" : " disabled") + ">Delete</button></div>" +
          (s.routineName ? '<p class="muted">' + esc(s.routineName) + "</p>" : "") +
          '<ul style="margin:0.5rem 0 0;padding-left:1.1rem">' + lines + "</ul>" +
        "</div>";
      }).join("");

      content.innerHTML = banner() + "<h2>History</h2>" +
        (cards || '<p class="empty">No sessions logged yet.</p>');
    }

    function renderRoutines() {
      const cards = state.routines.map((r) =>
        '<div class="card">' +
          '<div class="card-head"><h3>' + esc(r.name) + "</h3>" +
            "<span>" +
              '<button class="small" data-action="use-routine" data-id="' + esc(r.id) + '">Start</button> ' +
              '<button class="small" data-action="edit-routine" data-id="' + esc(r.id) + '"' +
                (token() ? "" : " disabled") + ">Edit</button> " +
              '<button class="small danger" data-action="delete-routine" data-id="' + esc(r.id) + '"' +
                (token() ? "" : " disabled") + ">Delete</button>" +
            "</span></div>" +
          '<ul style="margin:0.5rem 0 0;padding-left:1.1rem">' +
            r.exercises.map((e) => "<li>" + esc(e) + "</li>").join("") + "</ul>" +
        "</div>").join("");

      content.innerHTML = banner() + "<h2>Routines</h2>" +
        (cards || '<p class="empty">No routines yet.</p>') +
        '<h3 style="margin:1.5rem 0 0.75rem">Add a routine</h3>' +
        '<label><span>Name</span><input id="routine-name" placeholder="Push day"></label>' +
        '<label><span>Exercises, one per line</span>' +
          '<textarea id="routine-exercises" placeholder="Bench press&#10;Overhead press&#10;Triceps pushdown"></textarea></label>' +
        '<button class="primary" data-action="add-routine"' + (token() ? "" : " disabled") + ">Add routine</button>";
    }

    function renderSettings() {
      content.innerHTML = "<h2>Settings</h2>" +
        "<p>Sessions and routines are committed to <code>" + esc(REPO.owner + "/" + REPO.name) +
          "</code> as JSON, so they follow you across devices. Saving needs a GitHub token.</p>" +
        '<label><span>GitHub personal access token</span>' +
          '<input type="password" id="token" style="width:100%" placeholder="github_pat_…" value="' +
            esc(token()) + '"></label>' +
        '<div class="row"><button class="primary" data-action="save-token">Save token</button>' +
          '<button data-action="clear-token">Remove token</button>' +
          '<button data-action="reload">Reload data</button></div>' +
        '<p class="muted">Create a <strong>fine-grained</strong> token at ' +
          '<a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">' +
          "github.com/settings/personal-access-tokens</a>, limited to only the " +
          "<code>" + esc(REPO.name) + "</code> repository, with <strong>Contents: Read and write</strong> " +
          "and nothing else. The token is kept in this browser's local storage on this device only. " +
          "Anyone with access to this device can read it, so scope it narrowly and revoke it if the device is lost.</p>";
    }

    const views = { log: renderLog, history: renderHistory, routines: renderRoutines, settings: renderSettings };

    function currentView() {
      const name = (location.hash || "#log").slice(1);
      return views[name] ? name : "log";
    }

    function render() {
      const view = currentView();
      document.querySelectorAll("#nav a").forEach((a) =>
        a.classList.toggle("active", a.dataset.view === view));
      if (!state.loaded && !state.loadError && view !== "settings") {
        content.innerHTML = '<p class="empty">Loading…</p>';
        return;
      }
      views[view]();
    }

    // --------------------------------------------------------------- actions

    // Pull the log form's current values back into the draft. Called on every
    // edit so a refresh or a structural change never loses typed numbers.
    function captureDraft() {
      if (!state.draft) return;
      const date = document.getElementById("date");
      if (date) state.draft.date = date.value;
      document.querySelectorAll("table.sets input").forEach((input) => {
        const ex = state.draft.exercises[Number(input.dataset.ex)];
        if (!ex) return;
        const set = ex.sets[Number(input.dataset.set)];
        if (!set) return;
        set[input.dataset.field] = input.value;
      });
      saveDraft();
    }

    async function commit(key, data, message, onDone) {
      if (state.busy) return;
      state.busy = true;
      setStatus("Saving…");
      try {
        await saveFile(key, data, message);
        setStatus("Saved.");
        if (onDone) onDone();
      } catch (err) {
        setStatus("Save failed.");
        alert("Could not save to GitHub.\n\n" + err.message);
      } finally {
        state.busy = false;
        render();
      }
    }

    async function saveSession() {
      captureDraft();
      const draft = state.draft;
      const exercises = draft.exercises.map((ex) => ({
        name: ex.name,
        sets: ex.sets
          .filter((s) => String(s.reps).trim() !== "")
          .map((s) => ({
            weight: s.weight === "" || s.weight == null ? null : Number(s.weight),
            reps: Number(s.reps),
          })),
      })).filter((ex) => ex.sets.length);

      if (!exercises.length) {
        alert("Nothing to save yet. Enter reps for at least one set.");
        return;
      }

      const session = {
        id: uid("s_"),
        date: draft.date || today(),
        routineId: draft.routineId || null,
        routineName: draft.routineName || null,
        unit: UNIT,
        exercises: exercises,
      };
      const next = state.sessions.concat([session]);
      await commit("sessions", next, "Log session on " + session.date, () => {
        state.sessions = next;
        state.draft = null;
        saveDraft();
        location.hash = "#history";
      });
    }

    function handleClick(event) {
      const target = event.target.closest("[data-action]");
      if (!target) return;
      const action = target.dataset.action;
      const id = target.dataset.id;

      if (action === "add-set") {
        captureDraft();
        const sets = state.draft.exercises[Number(target.dataset.ex)].sets;
        // Carry the previous set forward: a straight-across set needs no typing,
        // and a changed one is a single edit rather than two.
        const previous = sets[sets.length - 1];
        sets.push(previous
          ? { weight: previous.weight, reps: previous.reps }
          : { weight: "", reps: "" });
        saveDraft();
        render();
      } else if (action === "remove-set") {
        captureDraft();
        const ex = state.draft.exercises[Number(target.dataset.ex)];
        ex.sets.splice(Number(target.dataset.set), 1);
        if (!ex.sets.length) ex.sets.push({ weight: "", reps: "" });
        saveDraft();
        render();
      } else if (action === "remove-exercise") {
        captureDraft();
        state.draft.exercises.splice(Number(target.dataset.ex), 1);
        saveDraft();
        render();
      } else if (action === "add-exercise") {
        const input = document.getElementById("new-exercise");
        const name = input.value.trim();
        if (!name) return;
        captureDraft();
        const last = lastSetsFor(name);
        state.draft.exercises.push({
          name: name,
          sets: last ? last.sets.map((s) => ({ weight: s.weight, reps: s.reps })) : [{ weight: "", reps: "" }],
        });
        saveDraft();
        render();
      } else if (action === "save-session") {
        saveSession();
      } else if (action === "clear-draft") {
        if (!confirm("Discard this session?")) return;
        state.draft = null;
        saveDraft();
        render();
      } else if (action === "add-routine") {
        const name = document.getElementById("routine-name").value.trim();
        const exercises = document.getElementById("routine-exercises").value
          .split("\n").map((s) => s.trim()).filter(Boolean);
        if (!name) { alert("Give the routine a name."); return; }
        if (!exercises.length) { alert("List at least one exercise."); return; }
        const next = state.routines.concat([{ id: uid("r_"), name: name, exercises: exercises }]);
        commit("routines", next, "Add routine: " + name, () => { state.routines = next; });
      } else if (action === "edit-routine") {
        const routine = state.routines.find((r) => r.id === id);
        const name = prompt("Routine name", routine.name);
        if (name === null) return;
        const list = prompt("Exercises, one per line", routine.exercises.join("\n"));
        if (list === null) return;
        const exercises = list.split("\n").map((s) => s.trim()).filter(Boolean);
        if (!name.trim() || !exercises.length) { alert("A routine needs a name and at least one exercise."); return; }
        const next = state.routines.map((r) =>
          r.id === id ? { id: r.id, name: name.trim(), exercises: exercises } : r);
        commit("routines", next, "Edit routine: " + name.trim(), () => { state.routines = next; });
      } else if (action === "delete-routine") {
        const routine = state.routines.find((r) => r.id === id);
        if (!confirm('Delete the routine "' + routine.name + '"? Logged sessions are kept.')) return;
        const next = state.routines.filter((r) => r.id !== id);
        commit("routines", next, "Delete routine: " + routine.name, () => { state.routines = next; });
      } else if (action === "use-routine") {
        state.draft = newDraft(id);
        saveDraft();
        location.hash = "#log";
      } else if (action === "delete-session") {
        const session = state.sessions.find((s) => s.id === id);
        if (!confirm("Delete the session from " + prettyDate(session.date) + "?")) return;
        const next = state.sessions.filter((s) => s.id !== id);
        commit("sessions", next, "Delete session from " + session.date, () => { state.sessions = next; });
      } else if (action === "save-token") {
        localStorage.setItem(TOKEN_KEY, document.getElementById("token").value.trim());
        loadAll().then(render);
      } else if (action === "clear-token") {
        localStorage.removeItem(TOKEN_KEY);
        loadAll().then(render);
      } else if (action === "reload") {
        loadAll().then(render);
      }
    }

    function handleChange(event) {
      const target = event.target;
      if (target.id === "routine") {
        // Switching routines rebuilds the exercise list, so confirm first if
        // anything has already been typed in.
        const typed = state.draft && state.draft.exercises.some((ex) =>
          ex.sets.some((s) => String(s.reps).trim() !== ""));
        if (typed && !confirm("Switch routine and discard the sets entered so far?")) {
          target.value = state.draft.routineId;
          return;
        }
        const date = state.draft ? state.draft.date : today();
        state.draft = newDraft(target.value);
        state.draft.date = date;
        saveDraft();
        render();
      } else if (target.id === "date" || target.closest("table.sets")) {
        captureDraft();
      }
    }

    // ------------------------------------------------------------------ init

    content.addEventListener("click", handleClick);
    content.addEventListener("change", handleChange);
    content.addEventListener("input", (e) => {
      if (e.target.closest("table.sets")) captureDraft();
    });
    window.addEventListener("hashchange", render);

    loadDraft();
    render();
    loadAll().then(render);
  })();
  </script>
</body>
</html>
